<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-eval'; worker-src blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <style>
    html, body { margin: 0; padding: 0; background: transparent; color: #f1ece7; }
    body { overflow: hidden; font-size: 30px; }
    #viewport { width: 100%; overflow-x: auto; overflow-y: hidden; }
    #viewport::-webkit-scrollbar { height: 3px; }
    #viewport::-webkit-scrollbar-thumb { background: #72645f; border-radius: 2px; }
    #formula { box-sizing: border-box; width: 100%; padding: 8px 0;
      display: flex; flex-direction: column; align-items: flex-end; gap: 18px; }
    #expression { cursor: text; width: max-content; min-width: 100%; }
    #expression > mjx-container { text-align: right; }
    #answer { text-align: right; width: max-content; }
    #glyph-work { position: fixed; left: 0; top: 0; visibility: hidden; pointer-events: none;
      font-size: 64px; width: max-content; }
    mjx-container, mjx-container[display="true"] { margin: 0 !important; outline: none; }
    mjx-container { position: relative; }
    /* Keep assistive MathML available to screen readers without drawing it twice. */
    mjx-assistive-mml, .MJX_Assistive_MathML { position: absolute !important;
      width: 1px !important; height: 1px !important; overflow: hidden !important;
      clip-path: inset(50%); white-space: nowrap !important; }
    .render-error { font: 16px serif; white-space: pre-wrap; }
  </style>
  <script src="renderer.js"></script>
  <script defer src="vendor/mathjax/tex-svg.js"></script>
</head>
<body><div id="formula" role="math"></div><div id="glyph-work" aria-hidden="true"></div></body>
</html>
